services:
  - type: web
    name: earnings-alpha-v3
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: earnings-alpha-db
          property: connectionString
      - key: ENABLE_LIVE_ORDERS
        value: "false"
      - key: PAPER_TRADING
        value: "true"
      - key: APP_SECRET
        generateValue: true
databases:
  - name: earnings-alpha-db
    plan: free
